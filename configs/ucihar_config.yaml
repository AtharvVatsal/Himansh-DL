# configs/ucihar_config.yaml
#
# Reference config for UCI-HAR. train.py currently takes these as CLI args
# (see src/train.py's parse_args), not a --config flag yet -- this file is
# the documented source of truth for those values so runs stay consistent
# across the weeks. If/when train.py grows a --config loader, these keys
# map 1:1 onto its argparse names.

dataset:
  name: ucihar
  # from preprocessing.py NATIVE_CONFIGS["ucihar"] -- UCI-HAR ships
  # pre-windowed by the source, we don't re-window it
  sampling_rate_hz: 50
  window_samples: 128        # 2.56s @ 50Hz
  step_samples: 64           # 50% overlap
  input_channels: 6          # total_acc_x/y/z, body_gyro_x/y/z (see UCIHAR_SIGNALS in preprocessing.py)
  num_classes: 6             # walking, upstairs, downstairs, sitting, standing, laying
  num_subjects: 30
  has_official_split: true   # real official train/test split (21/9 subjects), not a seeded fallback

evaluation:
  split_mode: official       # official | loso -- run both across the project, not just one
  loso_n_folds: 6             # from data_loader.py LOSO_N_FOLDS["ucihar"]; ~5 subjects held out/fold
  seeds: [0, 1, 2]             # minimum 3 seeds per plan's evaluation protocol

training:
  epochs: 50
  batch_size: 64
  lr: 0.001
  patience: 8                 # early-stopping patience, on held-out slice of train (see train.py)

model_defaults:
  # shared architecture knobs; not all models use every key
  hidden_size: 64
  num_layers: 2
  dropout: 0.3
  attention_dim: 64           # used by bilstm_attention_baseline and dual_attention_bigru

dual_attention_bigru:
  # proposed model (src/models/dual_attention_bigru.py) -- see
  # docs/research_gap_notes.md for the spectral-gated novelty writeup
  channel_reduction: 4
  low_band_hz: [0.3, 3.5]      # human gait/limb-swing band at UCI-HAR's 50Hz
  dual_attn_variant: full      # full | plain | channel_only | temporal_only (see train.py DUAL_ATTN_VARIANTS)

paths:
  raw_dir: data/raw/ucihar
  processed_dir: data/processed/ucihar
  checkpoint_dir: checkpoints
  results_csv: results/tables/raw_results.csv